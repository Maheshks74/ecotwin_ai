
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecotwin"
version = "0.1.0"
description = "Industrial Digital Twin with RL Energy Optimization"
authors = [{name = "EcoTwin Research"}]
requires-python = ">=3.10"
dependencies = [
    "simpy>=4.1.0",
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.3.0",
    "torch>=2.2.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=15.0.0",
    "tensorboard>=2.15.0",
    "google-genai>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ecotwin*"]

[tool.pytest.ini_options]
markers = [
    "live: tests requiring a real Google Gemini API connection"
]
