default_type: "tou" # "tou" or "iex"

tou:
  currency: "INR"
  demand_charge_inr_per_kw: 12.0 # INR per peak kW per 24h episode (~360 INR/kW-month)
  slabs:
    - name: "off_peak"
      start_hour: 22
      end_hour: 6
      rate_inr_per_kwh: 4.5
    - name: "normal"
      start_hour: 6
      end_hour: 18
      rate_inr_per_kwh: 7.2
    - name: "peak"
      start_hour: 18
      end_hour: 22
      rate_inr_per_kwh: 12.5

iex:
  csv_path: "data/iex_prices_sample.csv"
  demand_charge_inr_per_kw: 12.0
  fallback_to_tou: true

